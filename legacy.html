<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SOL SKATE</title><style>*{box-sizing:border-box;touch-action:none}body{margin:0;overflow:hidden;background:#8bb9d2;font-family:system-ui}canvas{display:block}#hud{position:fixed;top:10px;left:12px;color:white;text-shadow:1px 2px 4px #222;font-weight:900}#pad{position:fixed;bottom:9%;left:5%;width:125px;height:125px;border:3px solid #fff8;border-radius:50%;background:#ffffff33}#nub{position:absolute;left:37px;top:37px;width:46px;height:46px;border-radius:50%;background:#ffc83d}#keys{position:fixed;right:3%;bottom:7%;display:grid;grid-template-columns:repeat(3,60px);gap:8px}button{width:60px;height:60px;border-radius:50%;background:#ffca47;border:2px solid #fff9;font-weight:bold}#controller{position:fixed;top:10px;right:12px;color:white;background:#152636a8;padding:6px 10px;border-radius:9px;font-size:12px;font-weight:700;z-index:5}#message{position:fixed;top:20%;width:100%;text-align:center;color:white;font-weight:900;font-size:30px;text-shadow:2px 2px 4px #111}</style></head><body><canvas id="c"></canvas><div id="hud">SOL SKATE <small style="display:block">COMPATIBILITY EDITION · <a href="index.html" style="color:white">Try 3D</a></small><div id="score">SCORE 0</div><div id="speed">SPEED 0</div></div><div id="controller">🎮 Controller not detected</div><div id="message"></div><div id="pad"><div id="nub"></div></div><div id="keys"><button data-t="ollie">OLLIE</button><button data-t="kick">KICK</button><button data-t="heel">HEEL</button><button data-t="shove">SHOVE</button><button data-t="grab">GRAB</button><button data-t="push">PUSH</button></div><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),pad=document.querySelector('#pad'),nub=document.querySelector('#nub'),message=document.querySelector('#message');let w,h,last=performance.now(),joy={x:0,y:0,id:null},p={x:0,z:0,y:0,vy:0,dir:0,v:0,flip:0,spin:0,score:0,combo:0,name:'',tricks:0,multiplier:1,rotation:0,landings:0,bails:0};function resize(){w=c.width=innerWidth;h=c.height=innerHeight}addEventListener('resize',resize);resize();function proj(x,y,z){let dx=x-p.x,dz=z-p.z,s=Math.sin(p.dir),co=Math.cos(p.dir),side=dx*co-dz*s,front=dx*s+dz*co+10;if(front<.5)return null;let f=Math.min(w,h)/front;return [w/2+side*f,h*.63+(p.y-y)*f,f]}function line(a,b,color){let A=proj(...a),B=proj(...b);if(!A||!B)return;g.strokeStyle=color;g.beginPath();g.moveTo(A[0],A[1]);g.lineTo(B[0],B[1]);g.stroke()}function draw(){let sky=g.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#7fc4e8');sky.addColorStop(.55,'#c8e0d5');sky.addColorStop(.56,'#658a76');sky.addColorStop(1,'#51685d');g.fillStyle=sky;g.fillRect(0,0,w,h);for(let n=-100;n<180;n+=5){line([n,0,-100],[n,0,220],'#c1d4c055');line([-100,0,n],[100,0,n],'#c1d4c055')}for(const [x,z,a,b,t] of [[0,25,5,5,'RAMP'],[-7,43,2,12,'RAIL'],[8,65,7,8,'RAMP'],[0,92,10,3,'LEDGE'],[-12,125,6,8,'RAMP']]){let q=proj(x,1,z);if(!q)continue;g.fillStyle=t==='RAIL'?'#cda44d':'#89939a';g.fillRect(q[0]-a*q[2]/2,q[1]-b*q[2]/2,a*q[2],b*q[2]);g.strokeStyle='#eef2e7';g.strokeRect(q[0]-a*q[2]/2,q[1]-b*q[2]/2,a*q[2],b*q[2])}let s=Math.min(w,h)/360;g.save();g.translate(w/2,h*.66-p.y*18);g.fillStyle='#172331';g.beginPath();g.ellipse(0,32*s,26*s,8*s,0,0,7);g.fill();g.save();g.translate(0,20*s);g.rotate(p.spin);g.scale(Math.max(.12,Math.abs(Math.cos(p.flip))),1);g.fillStyle='#f5b737';g.fillRect(-29*s,-5*s,58*s,10*s);g.restore();g.strokeStyle='#182736';g.lineWidth=8*s;g.beginPath();g.moveTo(-10*s,15*s);g.lineTo(-9*s,-15*s);g.lineTo(0,-38*s);g.lineTo(12*s,-15*s);g.lineTo(10*s,15*s);g.stroke();g.fillStyle='#e6a943';g.fillRect(-14*s,-44*s,28*s,31*s);g.strokeStyle='#efc6a4';g.lineWidth=5*s;g.beginPath();g.moveTo(-14*s,-38*s);g.lineTo(-25*s,-20*s);g.moveTo(14*s,-38*s);g.lineTo(25*s,-20*s);g.stroke();g.fillStyle='#efc6a4';g.beginPath();g.arc(0,-54*s,11*s,0,7);g.fill();g.fillStyle='#151e2d';g.fillRect(-12*s,-64*s,24*s,8*s);g.restore();document.querySelector('#score').textContent='SCORE '+p.score;document.querySelector('#speed').textContent='SPEED '+Math.round(p.v*4)+(p.y>0?'  COMBO '+p.multiplier+'x':'')}function trick(t){if(t==='push'){p.v=Math.min(19,p.v+5);return}if(p.y>0){p.tricks++;p.multiplier=Math.min(12,1+p.tricks);p.combo+=t==='grab'?150:200;p.name=t.toUpperCase();if(t==='kick')p.flip+=1;if(t==='heel')p.flip-=1;if(t==='shove')p.spin+=1;return}p.vy=8;p.y=.01;p.combo=t==='ollie'?100:300;p.tricks=1;p.multiplier=1;p.name=t.toUpperCase();p.flip=0;p.spin=0}let msgUntil=0;let padIndex=null,prev=[],gx=0,gy=0,boost=false;const status=document.querySelector('#controller');function dz(v){return Math.abs(v)<.16?0:Math.sign(v)*(Math.abs(v)-.16)/.84}function pollPad(){let pads=[];try{pads=navigator.getGamepads?(navigator.getGamepads()||[]):[]}catch(_){pads=[]}let q=padIndex===null?null:pads[padIndex];if(!q)q=Array.from(pads).find(x=>x&&x.connected);if(!q){padIndex=null;gx=gy=0;boost=false;prev=[];status.textContent='🎮 Controller not detected';return}if(q.index!==padIndex){padIndex=q.index;prev=[]}status.textContent='🎮 Controller connected';gx=dz(q.axes[0]||0);gy=dz(q.axes[1]||0);for(const [i,t] of [[0,'ollie'],[2,'kick'],[1,'heel'],[3,'shove'],[5,'grab']])if(q.buttons[i]?.pressed&&!prev[i])trick(t);boost=!!q.buttons[7]?.pressed;prev=q.buttons.map(b=>b.pressed)}addEventListener('gamepadconnected',e=>{padIndex=e.gamepad.index;prev=[]});addEventListener('gamepaddisconnected',e=>{if(padIndex===e.gamepad.index)padIndex=null});function loop(now){let dt=Math.min(.04,(now-last)/1000);last=now;pollPad();p.dir+=Math.max(-1,Math.min(1,joy.x+gx))*dt*1.7;p.v=Math.max(0,Math.min(19,p.v-Math.max(-1,Math.min(1,joy.y+gy))*dt*12-p.v*dt*.17+(boost?dt*9:0)));p.x+=Math.sin(p.dir)*p.v*dt;p.z+=Math.cos(p.dir)*p.v*dt;if(p.y>0){p.vy-=19*dt;p.y+=p.vy*dt;if(p.y<=0){p.y=0;p.vy=0;const landing=Math.abs(p.flip-Math.round(p.flip))<.35&&Math.abs(p.spin-Math.round(p.spin))<.35;const earned=p.combo*p.multiplier;if(landing){p.score+=earned;p.landings++;message.textContent=p.name+'  '+p.multiplier+'x  +'+earned}else{p.bails++;p.v*=.25;message.textContent='BAIL! COMBO LOST'}msgUntil=now+1400;p.combo=0;p.tricks=0;p.multiplier=1;p.flip=0;p.spin=0}}if(now>msgUntil)message.textContent='';draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);function move(e){let r=pad.getBoundingClientRect(),rad=r.width*.34,x=(e.clientX-r.left-r.width/2)/rad,y=(e.clientY-r.top-r.height/2)/rad,m=Math.max(1,Math.hypot(x,y));joy.x=x/m;joy.y=y/m;nub.style.transform='translate('+joy.x*rad+'px,'+joy.y*rad+'px)'}pad.addEventListener('pointerdown',e=>{if(joy.id!==null)return;joy.id=e.pointerId;pad.setPointerCapture(e.pointerId);move(e)});pad.addEventListener('pointermove',e=>{if(joy.id===e.pointerId)move(e)});function release(e){if(joy.id!==e.pointerId)return;joy.id=null;joy.x=joy.y=0;nub.style.transform=''}pad.addEventListener('pointerup',release);pad.addEventListener('pointercancel',release);document.querySelectorAll('button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();trick(b.dataset.t)}));document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});addEventListener('keydown',e=>{if(e.code==='Space')trick('ollie');if(e.code==='KeyW')joy.y=-1;if(e.code==='KeyA')joy.x=-1;if(e.code==='KeyD')joy.x=1});addEventListener('keyup',e=>{if(['KeyW','KeyA','KeyD'].includes(e.code))joy.x=joy.y=0});</script></body></html>
