name: Import CC0 Kenney skate-boy asset (one-time)
on:
  push:
    branches: [feature/kenney-skater-asset-20261028]
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import verified original Kenney Mini Skate GLB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/kenney-mini-skate
          curl -fLsS --retry 3 --max-time 45 \
            'https://raw.githubusercontent.com/lalomorales22/threejskate/main/mini-skate/Models/GLB%20format/character-skate-boy.glb' \
            -o assets/kenney-mini-skate/character-skate-boy.glb
          test "$(git hash-object assets/kenney-mini-skate/character-skate-boy.glb)" = '78b1dae8d95b5a54c827b5a3f8e8e44935aa3888'
          mkdir -p assets/kenney-mini-skate/Textures
          curl -fLsS --retry 3 --max-time 30 \
            'https://raw.githubusercontent.com/lalomorales22/threejskate/main/mini-skate/Models/GLB%20format/Textures/colormap.png' \
            -o assets/kenney-mini-skate/Textures/colormap.png
          test "$(git hash-object assets/kenney-mini-skate/Textures/colormap.png)" = 'c6646e245404f334bfc719014ff08735b3e6fa82'
          curl -fLsS --retry 3 --max-time 30 \
            'https://raw.githubusercontent.com/lalomorales22/threejskate/main/mini-skate/License.txt' \
            -o assets/kenney-mini-skate/License.txt
          grep -q 'Creative Commons Zero, CC0' assets/kenney-mini-skate/License.txt
          mkdir -p assets/quaternius-hoodie
          curl -fLsS --retry 3 --max-time 60 \
            'https://raw.githubusercontent.com/nishit47/Blender-Pre-vis-Pipeline---Screenplay-to-Animatic/main/assets/Ultimate%20Modular%20Men%20Pack-glb/Hoodie%20Character.glb' \
            -o assets/quaternius-hoodie/hoodie-character.glb
          test "$(git hash-object assets/quaternius-hoodie/hoodie-character.glb)" = '8c4974b4d7e193bd6e7edab045d9a8e21fc19018'
          cat > assets/quaternius-hoodie/SOURCE.md <<'SOURCE'
          Hoodie Character from Quaternius Ultimate Modular Men Pack (2022).
          CC0 1.0 public domain; commercial reuse permitted.
          https://poly.pizza/bundle/Ultimate-Modular-Men-Pack-ZiH8muWqwQ
          https://poly.pizza/m/gKLBoRsyKe
          Binary mirror: https://github.com/nishit47/Blender-Pre-vis-Pipeline---Screenplay-to-Animatic
          Original mirrored Git blob SHA: 8c4974b4d7e193bd6e7edab045d9a8e21fc19018
          SOURCE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/kenney-mini-skate assets/quaternius-hoodie
          if ! git diff --cached --quiet; then
            git commit -m 'assets: import verified Kenney CC0 skater GLB and license'
            git push origin HEAD:feature/kenney-skater-asset-20261028
          fi

      - name: Inspect imported glTF skin, nodes, and clips
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const buf=fs.readFileSync('assets/kenney-mini-skate/character-skate-boy.glb');
          if(buf.toString('utf8',0,4)!=='glTF')throw Error('Invalid GLB');
          const len=buf.readUInt32LE(12);
          const gltf=JSON.parse(buf.toString('utf8',20,20+len));
          console.log('KENNEY_ASSET_METADATA',JSON.stringify({
            bytes:buf.length,
            scenes:gltf.scenes?.length,
            skins:gltf.skins?.map(s=>({name:s.name,joints:s.joints.map(i=>({index:i,name:gltf.nodes[i]?.name,children:gltf.nodes[i]?.children}))})),
            meshes:gltf.meshes?.map(m=>({name:m.name,primitives:m.primitives?.length})),
            nodes:gltf.nodes?.map((n,i)=>({i,name:n.name,mesh:n.mesh,skin:n.skin,children:n.children})),
            animations:gltf.animations?.map(a=>({name:a.name,channels:a.channels.length})),
            materials:gltf.materials?.map(m=>m.name),
            images:gltf.images?.map(i=>({name:i.name,uri:i.uri,mimeType:i.mimeType,bufferView:i.bufferView})),
            textures:gltf.textures?.map(t=>({name:t.name,source:t.source})),
            rootNode:gltf.nodes?.[0],
            animationLengths:gltf.animations?.filter(a=>a.name.startsWith('skate')).map(a=>({name:a.name,duration:Math.max(...a.samplers.map(s=>gltf.accessors[s.input]?.max?.[0]||0))})),
            meshBounds:gltf.meshes?.map(m=>m.primitives?.map(p=>({min:gltf.accessors[p.attributes.POSITION]?.min,max:gltf.accessors[p.attributes.POSITION]?.max})))
          },null,2));
          NODE

      - name: Inspect Quaternius hoodie rig and animation clips
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),b=fs.readFileSync('assets/quaternius-hoodie/hoodie-character.glb');
          if(b.toString('utf8',0,4)!=='glTF')throw Error('Invalid hoodie GLB');
          const g=JSON.parse(b.toString('utf8',20,20+b.readUInt32LE(12)));
          console.log('HOODIE_METADATA',JSON.stringify({
            bytes:b.length,scenes:g.scenes?.length,
            skins:g.skins?.map(s=>({name:s.name,joints:s.joints?.length,jointNames:s.joints?.map(i=>g.nodes[i]?.name)})),
            meshes:g.meshes?.map(m=>({name:m.name,primitives:m.primitives?.length,bounds:m.primitives?.map(p=>({min:g.accessors[p.attributes.POSITION]?.min,max:g.accessors[p.attributes.POSITION]?.max}))})),
            animations:g.animations?.map(a=>a.name),
            images:g.images?.map(i=>({name:i.name,uri:i.uri,mimeType:i.mimeType,bufferView:i.bufferView})),
            nodes:g.nodes?.filter(n=>n.name&&/root|armature|hips|head|foot|hand|leg|spine|arm/i.test(n.name)).slice(0,80).map(n=>({name:n.name,children:n.children,translation:n.translation}))
          },null,2));
          NODE
