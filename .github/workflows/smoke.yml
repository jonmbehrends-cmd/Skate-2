name: SOL SKATE manual browser diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-linux-1.55.1
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install chromium
      - name: Validate current WebGL game in Chromium
        run: node tests/browser_smoke.cjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-skate-manual-browser-preview
          path: test-artifacts/
          if-no-files-found: warn
