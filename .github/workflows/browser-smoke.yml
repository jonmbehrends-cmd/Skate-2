name: SOL SKATE Chromium visual smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # Keep QA for each PR independent from main's screenshot-publishing run.
  # A single repository-wide pending slot caused PR validation to be cancelled
  # when unrelated commits arrived, even with cancel-in-progress disabled.
  group: "sol-skate-browser-qa-${{ github.ref }}"
  cancel-in-progress: false
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-linux-1.55.1
      - run: npm install --no-save playwright@1.55.1 babylonjs@8
      # Ubuntu hosted runners include Chromium's standard shared libraries;
      # avoid apt install-deps, which can stall under heavy CI load.
      - run: npx playwright install chromium
      - name: Test procedural audio feedback on desktop and mobile
        run: node tests/audio_feedback_browser.cjs
      - name: Verify deterministic halfpipe pump physics
        run: node tests/pump_physics.cjs
      - name: Verify input ownership in desktop and mobile Chromium
        run: node tests/input_ownership_browser.cjs
      - name: Test mobile Chromium WebGL gameplay
        id: smoke
        continue-on-error: true
        run: node tests/browser_smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sol-skate-chromium-visual-evidence
          path: test-artifacts/
          if-no-files-found: warn
      - name: Persist screenshot and test outcome for review
        # PRs must never write unverified QA artifacts onto main.
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          # Source code can advance during Chromium testing. Never rebase a
          # QA commit containing binary PNGs: that creates merge conflicts.
          # Instead, rebuild the QA-only commit atop the freshest main.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p qa
            # An older queued test must not replace evidence from a newer run.
            if test -f qa/tested-commit.txt; then
              tested=$(cat qa/tested-commit.txt)
              if test "$tested" != "$GITHUB_SHA" && git merge-base --is-ancestor "$GITHUB_SHA" "$tested" 2>/dev/null; then
                echo "QA for newer source $tested already recorded; skipping older run."
                exit 0
              fi
            fi
            printf '%s\n' "$GITHUB_SHA" > qa/tested-commit.txt
            for name in skater-closeup-chromium.png spawn-mobile.png halfpipe-chromium.png halfpipe-mobile.png boardslide-chromium.png bowl-chromium.png bowl-debug.png park-chromium.png park-mural-chromium.png park-perimeter-lighting.png; do
              if test -f "test-artifacts/$name"; then cp "test-artifacts/$name" "qa/$name"; fi
            done
            if test -f test-artifacts/browser-result.txt; then
              cp test-artifacts/browser-result.txt qa/browser-result.txt
            else
              echo 'FAIL: Chromium smoke did not produce a result (setup or startup failed)' > qa/browser-result.txt
            fi
            git add qa/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'QA: update real Chromium screenshot evidence [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            echo "Main advanced during QA push; retrying on latest HEAD ($attempt/5)"
            sleep 2
          done
          echo 'Unable to publish QA after five safe retries' >&2
          exit 1
      - name: Require Chromium gameplay smoke to pass
        if: steps.smoke.outcome == 'failure'
        run: exit 1
