name: SOL SKATE Chromium visual smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser_smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halfpipe-chromium-screenshot
          path: test-artifacts/halfpipe-chromium.png
          if-no-files-found: ignore
