name: SOL SKATE Chromium visual smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sol-skate-browser-qa
  cancel-in-progress: false
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-linux-1.55.1
      - run: npm install --no-save playwright@1.55.1
      # Ubuntu hosted runners include Chromium's standard shared libraries;
      # avoid apt install-deps, which can stall under heavy CI load.
      - run: npx playwright install chromium
      - name: Test mobile Chromium WebGL gameplay
        id: smoke
        continue-on-error: true
        run: node tests/browser_smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sol-skate-chromium-visual-evidence
          path: test-artifacts/
          if-no-files-found: warn
      - name: Persist screenshot and test outcome for review
        if: always()
        shell: bash
        run: |
          mkdir -p qa
          printf '%s\n' "$GITHUB_SHA" > qa/tested-commit.txt
          # Preserve last successful screenshots if a new smoke fails early.
          # qa/tested-commit.txt + browser-result.txt identify current status.
          for name in halfpipe-chromium.png halfpipe-mobile.png bowl-chromium.png bowl-debug.png park-chromium.png; do
            if test -f "test-artifacts/$name"; then cp "test-artifacts/$name" "qa/$name"; fi
          done
          if test -f test-artifacts/browser-result.txt; then
            cp test-artifacts/browser-result.txt qa/browser-result.txt
          else
            echo 'FAIL: Chromium smoke did not produce a result (setup or startup failed)' > qa/browser-result.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/
          if ! git diff --cached --quiet; then
            git commit -m 'QA: update real Chromium screenshot evidence [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Require Chromium gameplay smoke to pass
        if: steps.smoke.outcome == 'failure'
        run: exit 1
