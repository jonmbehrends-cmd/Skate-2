name: Surf Tour Live score sync
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch live WSL data
        env:
          ALTSPORTS_API_KEY: ${{ secrets.ALTSPORTS_API_KEY }}
        run: node surf-tour-live/sync.mjs
      - name: Commit updated scoreboard
        run: |
          git config user.name "surf-tour-live-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add surf-tour-live/api/scoreboard.json
          if ! git diff --cached --quiet; then
            git commit -m "Update WSL scoreboard"
            git push
          fi
