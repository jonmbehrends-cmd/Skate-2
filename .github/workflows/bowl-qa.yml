name: SOL SKATE gameplay acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bowl-qa-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  bowl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/bowl.cjs
      - run: npm install --no-save playwright@1.55.1 babylonjs@8
      - run: npx playwright install chromium
      - name: Mobile scene, joystick, push and halfpipe
        run: node tests/browser_smoke.cjs
      - name: Input release and startup recovery
        run: node tests/input_browser.cjs
      - name: Ten uninterrupted airs in running WebGL game
        id: bowl
        continue-on-error: true
        run: node tests/bowl_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bowl-air-evidence
          path: test-artifacts/
      - if: steps.bowl.outcome == 'failure'
        run: exit 1
