name: Skeletal character acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skeletal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.1 babylonjs@8.32.1 babylonjs-loaders@8.32.1
      - run: npx playwright install chromium
      - run: node tests/rigged_skater.cjs
      - run: node tests/kenney_skater.cjs
      - run: node tests/rigged_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skeletal-character-evidence
          path: test-artifacts/
