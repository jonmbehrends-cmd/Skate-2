name: Hoodie skeletal character acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hoodie:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.1 babylonjs@8.32.1 babylonjs-loaders@8.32.1
      - run: npx playwright install chromium
      - run: node --check hoodie_skater.js && node --check tests/rigged_browser.cjs
      - run: node tests/hoodie_skater.cjs
      - run: node tests/rigged_browser.cjs
      - run: node --check tools/animation_profile.cjs && node tests/animation_ancestor_probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hoodie-skeletal-evidence
          path: test-artifacts/
