name: SOL SKATE logic regression
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check controller.js && node --check landing.js && node --check terrain.js && node --check ramp_geometry.js && node --check obstacles.js && node --check grind.js && node --check motion.js && node --check wheels.js && node --check skater.js && node --check board_geometry.js && node --check bowl.js
      - run: node tests/controller.cjs
      - run: node tests/terrain.cjs
      - run: node tests/obstacles.cjs
      - run: node tests/grind.cjs
      - run: node tests/motion.cjs
      - run: node tests/wheels.cjs
      - run: node tests/landing.cjs
      - run: node tests/board_geometry.cjs
      - run: node tests/check_inline.cjs
      - run: node tests/push.cjs
      - run: node tests/ramp_mesh.cjs
      - run: node tests/halfpipe.cjs
      - run: node tests/input.cjs
      - run: node tests/bowl.cjs
