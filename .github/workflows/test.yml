name: SOL SKATE logic regression
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check controller.js && node --check landing.js && node --check terrain.js && node --check obstacles.js && node --check grind.js
      - run: node tests/controller.cjs
      - run: node tests/terrain.cjs
      - run: node tests/obstacles.cjs
      - run: node tests/grind.cjs
      - run: node tests/landing.cjs
      - run: node tests/check_inline.cjs
