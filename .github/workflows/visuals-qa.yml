name: SOL SKATE ramp and rider visual acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.1 babylonjs@8.56.2
      - run: npx playwright install chromium
      - run: node tests/board_v2.cjs
      - run: node tests/visuals_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramp-rider-before-after
          path: test-artifacts/visuals/
