<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta charset="utf-8"><title>SOL SKATE 3D ALPHA</title><style>*{box-sizing:border-box;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:system-ui}#render{width:100%;height:100%;display:block}#hud{position:fixed;top:12px;left:12px;font-weight:900;text-shadow:0 2px 5px #000;font-size:17px;pointer-events:none}#status{position:fixed;top:12px;right:12px;font-size:12px;background:#0009;padding:7px;border-radius:8px}#msg{position:fixed;top:24%;width:100%;text-align:center;font-size:25px;font-weight:900;text-shadow:0 2px 8px #000;pointer-events:none}#stick{position:fixed;bottom:8%;left:5%;height:125px;width:125px;border-radius:100%;border:3px solid #fff9;background:#ffffff22}#nub{position:absolute;top:37px;left:37px;width:46px;height:46px;border-radius:50%;background:#ffc23d}#buttons{position:fixed;bottom:7%;right:3%;display:grid;grid-template-columns:repeat(3,60px);gap:7px}button{border-radius:50%;width:60px;height:60px;border:2px solid #fff8;background:#ffc23d;color:#141414;font-weight:800}#error{position:fixed;inset:15%;display:none;background:#151d27ed;padding:24px;z-index:10;border-radius:12px}</style></head><body><canvas id="render"></canvas><div id="hud">SOL SKATE · 3D ALPHA<div id="score">SCORE 0</div><div id="speed">SPEED 0</div></div><div id="status">🎮 Press a controller button</div><div id="msg"></div><div id="stick"><div id="nub"></div></div><div id="buttons"><button data-t="ollie">OLLIE</button><button data-t="kick">KICK</button><button data-t="heel">HEEL</button><button data-t="shove">SHOVE</button><button data-t="grab">GRAB</button><button data-t="push">PUSH</button></div><div id="error"></div><script src="https://cdn.babylonjs.com/babylon.js"></script><script>
(()=>{const err=document.querySelector('#error');try{if(!window.BABYLON)throw Error('3D engine could not load');const B=BABYLON,canvas=document.querySelector('#render'),engine=new B.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true,adaptToDeviceRatio:false});engine.setHardwareScalingLevel(Math.max(1,devicePixelRatio/1.6));const scene=new B.Scene(engine);scene.clearColor=new B.Color4(.52,.72,.85,1);const camera=new B.FollowCamera('follow',new B.Vector3(0,6,-14),scene);camera.radius=14;camera.heightOffset=5;camera.rotationOffset=180;camera.cameraAcceleration=.06;camera.maxCameraSpeed=25;scene.activeCamera=camera;const light=new B.HemisphericLight('sky',new B.Vector3(0,1,0),scene);light.intensity=.85;const sun=new B.DirectionalLight('sun',new B.Vector3(-.4,-1,.5),scene);sun.intensity=1.25;const shadow=new B.ShadowGenerator(1024,sun);shadow.useBlurExponentialShadowMap=true;shadow.blurKernel=6;function mat(n,c){const m=new B.StandardMaterial(n,scene);m.diffuseColor=B.Color3.FromHexString(c);return m}const concrete=mat('concrete','#89928e'),stripe=mat('paint','#e8e6d9'),metal=mat('steel','#4e646b'),deck=mat('deck','#dca132'),shirt=mat('shirt','#e8a42f'),pants=mat('pants','#172e40'),skin=mat('skin','#d6a17d'),wheel=mat('wheels','#181f29'),grass=mat('grass','#4f735b');function box(n,w,h,d,x,y,z,m){let q=B.MeshBuilder.CreateBox(n,{width:w,height:h,depth:d},scene);q.position.set(x,y,z);q.material=m;q.receiveShadows=true;return q}box('park',150,.3,180,0,-.2,0,concrete);for(let i=-70;i<=70;i+=10){box('joint',.055,.01,180,i,.005,0,stripe)}for(let i=-85;i<=85;i+=10){box('joint',150,.01,.055,0,.005,i,stripe)}for(const [x,z,w,d] of [[-12,15,8,12],[15,26,10,15],[-17,55,12,10],[10,68,14,13]]){const ramp=box('bank',w,.6,d,x,.3,z,concrete);ramp.rotation.x=-.13;box('lip',w,.12,.25,x,.7,z+d/2,metal)}for(const [x,z,len] of [[0,19,9],[-9,39,13],[12,52,10]]){box('rail',.15,.16,len,x,1.1,z,metal);for(let t of [-len*.4,len*.4])box('rail leg',.13,1,.13,x,.5,z+t,metal)}for(const [x,z,w,d] of [[5,34,5,3],[-5,71,8,4]])box('ledge',w,1,d,x,.5,z,metal);const skater=new B.TransformNode('skater',scene);const boardPivot=new B.TransformNode('board pivot',scene);boardPivot.parent=skater;box('deck',.55,.11,1.65,0,.18,0,deck).parent=boardPivot;for(let z of [-.52,.52])for(let x of [-.27,.27])box('wheel',.14,.17,.15,x,.06,z,wheel).parent=boardPivot;const body=new B.TransformNode('body',scene);body.parent=skater;const torso=B.MeshBuilder.CreateCylinder('torso',{height:.85,diameterTop:.52,diameterBottom:.68,tessellation:12},scene);torso.parent=body;torso.position.set(0,1.37,0);torso.material=shirt;const head=B.MeshBuilder.CreateSphere('head',{diameter:.4,segments:12},scene);head.parent=body;head.position.set(0,2.02,0);head.material=skin;const helmet=B.MeshBuilder.CreateSphere('helmet',{diameter:.43,segments:12,slice:.5},scene);helmet.parent=body;helmet.position.set(0,2.15,0);helmet.material=pants;for(let x of [-.2,.2]){const leg=B.MeshBuilder.CreateCylinder('leg',{height:.76,diameter:.2,tessellation:10},scene);leg.parent=body;leg.position.set(x,.72,0);leg.material=pants;const arm=B.MeshBuilder.CreateCylinder('arm',{height:.75,diameter:.17,tessellation:10},scene);arm.parent=body;arm.position.set(x*2.15,1.38,0);arm.rotation.z=x>0?.18:-.18;arm.material=skin;box('shoe',.24,.13,.4,x,.29,.12,wheel).parent=body}camera.lockedTarget=skater;for(let mesh of scene.meshes)if(['deck','torso','head','leg','arm'].includes(mesh.name))shadow.addShadowCaster(mesh);const rails=[{x:0,z:19,len:9},{x:-9,z:39,len:13},{x:12,z:52,len:10}];const ramps=[{x:-12,z:15,w:8,d:12},{x:15,z:26,w:10,d:15},{x:-17,z:55,w:12,d:10},{x:10,z:68,w:14,d:13}];const state={x:0,z:0,dir:0,speed:0,y:0,vy:0,flip:0,spin:0,combo:0,count:0,score:0,name:'',messageUntil:0,airTime:0,flipStart:0,spinStart:0,landingQuality:0,grinding:false,grindTime:0,grindRail:null,rampCooldown:0,groundY:0,grounded:true};let joy={x:0,y:0,id:null},gpX=0,gpY=0,boost=false,padIndex=null,prev=[],last=performance.now();const status=document.querySelector('#status'),msg=document.querySelector('#msg');window.__SOL_DIAGNOSTICS__={engine,scene,state,skater};function trick(t){if(t==='push'){state.speed=Math.min(17,state.speed+4);return}if(state.y>0||state.grinding){if(state.grinding){state.grinding=false;state.vy=5;state.y=1.11}state.count++;state.combo+=t==='grab'?150:200;if(t==='kick')state.flip++;if(t==='heel')state.flip--;if(t==='shove')state.spin++;state.name=t.toUpperCase();return}state.y=.01;state.vy=8;state.airTime=0;state.combo=t==='ollie'?100:300;state.count=1;state.name=t.toUpperCase();state.flip=t==='kick'?1:t==='heel'?-1:0;state.spin=t==='shove'?1:0}function dz(x){return Math.abs(x)<.15?0:Math.sign(x)*(Math.abs(x)-.15)/.85}function gamepad(){const all=navigator.getGamepads?navigator.getGamepads():[];let p=padIndex===null?null:all[padIndex];if(!p)p=Array.from(all).find(x=>x&&x.connected);if(!p){padIndex=null;gpX=gpY=0;boost=false;prev=[];status.textContent='🎮 Press a controller button';return}if(padIndex!==p.index){padIndex=p.index;prev=[]}status.textContent='🎮 '+(p.id.toLowerCase().includes('xbox')?'Xbox connected':'Controller connected');gpX=dz(p.axes[0]||0);gpY=dz(p.axes[1]||0);for(let [i,t] of [[0,'ollie'],[2,'kick'],[1,'heel'],[3,'shove'],[5,'grab']])if(p.buttons[i]?.pressed&&!prev[i])trick(t);boost=!!p.buttons[7]?.pressed;prev=p.buttons.map(x=>x.pressed)}addEventListener('gamepadconnected',e=>{padIndex=e.gamepad.index;prev=[]});addEventListener('gamepaddisconnected',e=>{if(e.gamepad.index===padIndex)padIndex=null});engine.runRenderLoop(()=>{let now=performance.now(),dt=Math.min(.04,(now-last)/1000);last=now;gamepad();let steer=Math.max(-1,Math.min(1,joy.x+gpX)),throttle=Math.max(-1,Math.min(1,joy.y+gpY));state.dir+=steer*dt*(.65+Math.min(1,state.speed/12))*(state.grinding?.12:1);state.speed=Math.max(0,Math.min(17,state.speed-throttle*dt*8-state.speed*dt*(state.grinding?.08:.16)+(boost?dt*9:0)));state.x+=Math.sin(state.dir)*state.speed*dt;state.z+=Math.cos(state.dir)*state.speed*dt;state.x=Math.max(-73,Math.min(73,state.x));state.z=Math.max(-88,Math.min(88,state.z));state.rampCooldown=Math.max(0,state.rampCooldown-dt);if(!state.grinding&&state.y===0&&state.rampCooldown===0&&state.speed>3){for(const ramp of ramps){if(Math.abs(state.x-ramp.x)<ramp.w*.5&&Math.abs(state.z-ramp.z)<ramp.d*.5&&Math.abs(state.z-ramp.z)>ramp.d*.37){state.y=.02;state.vy=4+Math.min(5,state.speed*.36);state.airTime=0;state.rampCooldown=1.5;state.name='RAMP AIR';state.combo=100;state.count=1;break}}}if(!state.grinding&&state.y>.55&&state.vy<=0&&state.speed>2){for(const rail of rails){if(Math.abs(state.x-rail.x)<.42&&Math.abs(state.z-rail.z)<rail.len*.5&&Math.cos(state.dir)>.5){state.grinding=true;state.grindRail=rail;state.grindTime=0;state.y=1.1;state.vy=0;state.name='50-50 GRIND';state.combo+=250;state.count++;break}}}if(state.grinding){state.grindTime+=dt;state.y=1.1;state.vy=0;state.x=state.grindRail.x;state.combo+=110*dt;if(Math.abs(state.z-state.grindRail.z)>state.grindRail.len*.5||state.grindTime>3){state.grinding=false;state.vy=2.2;state.y=1.11;state.rampCooldown=.8}}else if(state.y>0){state.airTime+=dt;state.vy-=19*dt;state.y+=state.vy*dt;if(state.y<=0){state.y=0;state.vy=0;let points=state.combo*Math.min(12,state.count);const rotationComplete=(Math.abs(state.flip)<.001&&Math.abs(state.spin)<.001)||state.airTime>=.49;const landed=rotationComplete&&state.airTime>.12;if(landed){state.score+=points;msg.textContent=state.name+' +'+points}else{state.speed*=.3;msg.textContent='BAIL — COMBO LOST'}state.messageUntil=now+1200;state.combo=state.count=state.flip=state.spin=0;state.airTime=0}}if(now>state.messageUntil)msg.textContent='';skater.position.set(state.x,state.y,state.z);skater.rotation.y=state.dir;const trickProgress=Math.min(1,state.airTime/.5);boardPivot.rotation.z=state.y>0?state.flip*Math.PI*2*trickProgress:0;boardPivot.rotation.y=state.y>0?state.spin*Math.PI*2*trickProgress:0;body.rotation.z=steer*.12;body.rotation.x=state.y>0?-.13:Math.min(.08,state.speed*.005);body.position.y=state.y>0?-.18:0;document.querySelector('#score').textContent='SCORE '+state.score;document.querySelector('#speed').textContent='SPEED '+Math.round(state.speed*4)+(state.grinding?'  GRIND':state.y>0?'  AIR':'');scene.render()});addEventListener('resize',()=>engine.resize());const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');function move(e){let r=stick.getBoundingClientRect(),rad=r.width*.34,x=(e.clientX-r.left-r.width/2)/rad,y=(e.clientY-r.top-r.height/2)/rad,m=Math.max(1,Math.hypot(x,y));joy.x=x/m;joy.y=y/m;nub.style.transform='translate('+joy.x*rad+'px,'+joy.y*rad+'px)'}stick.addEventListener('pointerdown',e=>{if(joy.id!==null)return;joy.id=e.pointerId;stick.setPointerCapture(e.pointerId);move(e)});stick.addEventListener('pointermove',e=>{if(joy.id===e.pointerId)move(e)});function release(e){if(joy.id!==e.pointerId)return;joy.id=null;joy.x=joy.y=0;nub.style.transform=''}stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);document.querySelectorAll('button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();trick(b.dataset.t)}));document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});addEventListener('keydown',e=>{if(e.code==='Space')trick('ollie');if(e.code==='KeyW')joy.y=-1;if(e.code==='KeyA')joy.x=-1;if(e.code==='KeyD')joy.x=1});addEventListener('keyup',e=>{if(['KeyW','KeyA','KeyD'].includes(e.code))joy.x=joy.y=0})}catch(e){err.style.display='block';err.textContent='3D initialization failed: '+e.message+' — The original game remains available at legacy.html';console.error(e)}})();
